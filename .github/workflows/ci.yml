# Runs on every pull request and every push to main: the same checks as `bash scripts/check.sh`.
# A change that fails here must not be merged or deployed.
name: checks
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: system tools the tests use
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: quality gate
        run: python scripts/quality_gate.py
      - name: tests
        run: python -m pytest -q
