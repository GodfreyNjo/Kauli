{# Alternate-language links for search engines. Expects `hreflang_alts`: a list of (hreflang, absolute_url) and `hreflang_default`: the absolute URL used for x-default. #}
{% for code, url in hreflang_alts %}<link rel="alternate" hreflang="{{ code }}" href="{{ url }}">
{% endfor %}<link rel="alternate" hreflang="x-default" href="{{ hreflang_default }}">
