<!-- Google Analytics (GA4) - included only on the public marketing/blog/solution
     pages (see the m-public templates below), never in base.html itself, so it
     never runs inside the logged-in client or staff app.
     Gated behind real cookie consent (see base.html's cookie-notice/
     cookie-prefs script): this only DEFINES the loader, it never calls it. GA
     doesn't actually load until the visitor has accepted analytics cookies -
     either just now via the banner/preferences modal, or on a past visit
     recorded in localStorage. What this collects and why is disclosed at
     /privacy#cookies. -->
<script>
  window.__kauliGaId = {{ ga_measurement_id|tojson }};
  window.__kauliLoadGA = function () {
    if (window.__kauliGaLoaded) return;
    window.__kauliGaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.__kauliGaId;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    // Explicit Google Consent Mode grant - this loader only ever runs
    // AFTER real cookie-notice acceptance in the first place (see
    // maybeLoadGA in base.html), so there's no separate "default: denied"
    // state to declare first; this just removes any ambiguity for
    // gtag.js's own internal consent handling, which real-world testing
    // showed can otherwise delay when hits actually reach Google's
    // servers, not just skip them.
    gtag('consent', 'default', {analytics_storage: 'granted'});
    gtag('js', new Date());
    gtag('config', window.__kauliGaId);
  };
</script>
<script>
  // Primary-action clicks (nav / hero / final CTA / pricing plans ...), sent
  // ONLY when analytics has been loaded after real cookie consent (gtag is
  // undefined until then), so this never tracks anyone who said no.
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-cta]');
    if (!el || typeof window.gtag !== 'function') return;
    window.gtag('event', 'cta_click', {
      cta_location: el.getAttribute('data-cta'),
      cta_text: (el.textContent || '').trim().slice(0, 40)
    });
  });
</script>
<script>
  // What visitors DO on a page, beyond the page view. Every call goes through kauliTrack, which sends nothing until analytics has been
  // loaded after real cookie consent (gtag does not exist before then), so nobody who said no is measured. No personal data is sent:
  // page paths, kinds of interaction and counts only.
  window.kauliTrack = function (name, params) {
    if (typeof window.gtag === 'function') window.gtag('event', name, params || {});
  };
  (function () {
    var track = window.kauliTrack, page = location.pathname;

    // How far down the page people read (25, 50, 75 and 100 percent), once each.
    var marks = [25, 50, 75, 100], sent = {}, waiting = false;
    function depth() {
      waiting = false;
      var h = document.documentElement, total = Math.max(h.scrollHeight, 1);
      var pct = Math.round((window.scrollY + window.innerHeight) / total * 100);
      marks.forEach(function (m) { if (pct >= m && !sent[m]) { sent[m] = 1; track('scroll_depth', { percent: m, page_path: page }); } });
    }
    window.addEventListener('scroll', function () { if (!waiting) { waiting = true; setTimeout(depth, 250); } }, { passive: true });

    // The pricing section coming into view.
    var pricing = document.getElementById('pricing');
    if (pricing && 'IntersectionObserver' in window) {
      var seen = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { track('view_pricing', { page_path: page }); seen.disconnect(); } });
      }, { threshold: 0.4 });
      seen.observe(pricing);
    }

    // Any video on the site: started, and watched to the end. Media events do not bubble, so listen in the capture phase.
    function label(v) { return ((v.currentSrc || v.getAttribute('src') || '').split('/').pop() || 'video').slice(0, 60); }
    document.addEventListener('play', function (e) { if (e.target && e.target.tagName === 'VIDEO') track('video_play', { video: label(e.target), page_path: page }); }, true);
    document.addEventListener('ended', function (e) { if (e.target && e.target.tagName === 'VIDEO') track('video_complete', { video: label(e.target), page_path: page }); }, true);

    // The first time someone touches a form (the contact and demo forms, the sign-up form): how many start versus how many finish.
    var started = {};
    document.addEventListener('focusin', function (e) {
      var form = e.target && e.target.closest && e.target.closest('form');
      if (!form) return;
      var id = form.id || form.getAttribute('action') || 'form';
      if (started[id]) return;
      started[id] = 1;
      track('form_start', { form: String(id).slice(0, 60), page_path: page });
    });

    // People who go for the email address instead of a button.
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="mailto:"]');
      if (a) track('contact_click', { method: 'email', page_path: page });
    });
  })();
</script>
<!-- End Google Analytics -->
