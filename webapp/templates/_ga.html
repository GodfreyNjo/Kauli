<!-- Google Analytics (GA4) - included only on the public marketing/blog/solution
     pages (see the m-public templates below), never in base.html itself, so it
     never runs inside the logged-in client or staff app.
     Gated behind real cookie consent (see base.html's cookie-notice/
     cookie-prefs script): this only DEFINES the loader, it never calls it. GA
     doesn't actually load until the visitor has accepted analytics cookies -
     either just now via the banner/preferences modal, or on a past visit
     recorded in localStorage. What this collects and why is disclosed at
     /privacy#cookies. -->
<script>
  window.__kauliGaId = {{ ga_measurement_id|tojson }};
  window.__kauliLoadGA = function () {
    if (window.__kauliGaLoaded) return;
    window.__kauliGaLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.__kauliGaId;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    window.gtag = gtag;
    // Explicit Google Consent Mode grant - this loader only ever runs
    // AFTER real cookie-notice acceptance in the first place (see
    // maybeLoadGA in base.html), so there's no separate "default: denied"
    // state to declare first; this just removes any ambiguity for
    // gtag.js's own internal consent handling, which real-world testing
    // showed can otherwise delay when hits actually reach Google's
    // servers, not just skip them.
    gtag('consent', 'default', {analytics_storage: 'granted'});
    gtag('js', new Date());
    gtag('config', window.__kauliGaId);
  };
</script>
<!-- End Google Analytics -->
