<form method="post" action="/login/magic" class="auth-magic">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label class="auth-field"><span>Or get a sign-in link by email</span>
    <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required aria-label="Email address for a sign-in link">
  </label>
  <button type="submit" class="secondary auth-magic-btn">Email me a sign-in link</button>
  <p class="auth-magic-note">No password needed. The link works once, and it creates your account if you do not have one yet.</p>
</form>
