# Checks that run on every commit. Install once with: pre-commit install
# They are the same checks CI runs (see .github/workflows/ci.yml), so a commit that passes here passes there.
repos:
  - repo: local
    hooks:
      - id: quality-gate
        name: quality gate (lint, function length, module length)
        entry: python scripts/quality_gate.py
        language: system
        pass_filenames: false
        types: [python]
      - id: whitespace
        name: no trailing whitespace or missing final newline
        entry: python scripts/check_whitespace.py
        language: system
        types_or: [python, html, javascript, css, markdown]
